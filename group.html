<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="description" content="This is a private group invite. It only works inside the app.">
    <title>You’re invited to a group on ENSO — Enso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/legal.css">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
</head>
<body>
    <header class="header">
        <nav class="nav">
            <a href="/" class="nav-brand"><img src="/ENSO-BG-Removed.png" alt="Enso" class="logo-img"></a>
        </nav>
    </header>

    <main class="open-page">
        <div class="container">
            <div class="open-card">
                <h1>You’re invited to a group on ENSO</h1>
                <p id="lead">This is a private group invite. It only works inside the app.</p>
                <div class="open-actions">
                    <a class="open-primary" id="open" href="#">Open in ENSO</a>
                    <a class="open-secondary" id="store" href="/#signup" rel="noopener">Get the app</a>
                </div>
                <p style="margin-top:1.25rem;font-size:.85rem">Once ENSO is installed, open this link again and it will land in the app.</p>
            </div>
        </div>
    </main>
    <script>
      (function () {
        // Same path, custom scheme — works before domain verification has propagated.
        var code = (location.pathname.match(/\/g\/([0-9a-f]{16})/i) || [])[1];
        var open = document.getElementById('open');
        if (!code) { open.style.display = 'none'; document.getElementById('lead').textContent = 'This link is incomplete. Ask for it again.'; return; }
        open.href = 'enso://g/' + code;
        var ua = navigator.userAgent || '';
        var store = document.getElementById('store');
        if (/android/i.test(ua)) store.href = 'https://play.google.com/store/apps/details?id=app.ensosocial';
        else if (/iphone|ipad|ipod/i.test(ua)) store.href = 'https://apps.apple.com/app/id6805994959';
      })();
    </script>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-brand"><strong>Enso</strong><p class="footer-tagline">Your life, not a scoreboard.</p></div>
                <nav class="footer-links" aria-label="Footer navigation">
                    <a href="/terms">Terms</a><a href="/privacy">Privacy</a><a href="mailto:support@ensosocial.app">Contact</a>
                </nav>
            </div>
        </div>
    </footer>
</body>
</html>
